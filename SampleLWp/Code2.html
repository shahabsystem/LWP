<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ترمینال تایپ سریع</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0f14;
      font-family: Consolas, "Courier New", monospace;
      color: #00ff88;
      direction: ltr;
    }

    .terminal {
      width: min(900px, 92vw);
      height: 560px;
      overflow: hidden;
      border: 1px solid #263746;
      border-radius: 12px;
      background: #071015;
      box-shadow: 0 0 35px rgba(0, 255, 136, 0.15);
    }

    .terminal-header {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 15px;
      background: #16212b;
      border-bottom: 1px solid #263746;
    }

    .circle {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .red {
      background: #ff5f56;
    }

    .yellow {
      background: #ffbd2e;
    }

    .green {
      background: #27c93f;
    }

    .terminal-title {
      margin-left: 10px;
      color: #9aa9b5;
      font-size: 13px;
    }

    .terminal-body {
      height: calc(100% - 42px);
      padding: 20px;
      overflow-y: auto;
      font-size: 15px;
      line-height: 1.8;
      text-align: left;
      direction: ltr;
    }

    .line {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .prompt {
      color: #00ff88;
    }

    .command {
      color: #ffffff;
    }

    .output {
      color: #86a5b5;
    }

    .error {
      color: #ff6b6b;
    }

    .cursor {
      display: inline-block;
      width: 9px;
      height: 18px;
      margin-left: 4px;
      vertical-align: middle;
      background: #00ff88;
      animation: blink 0.55s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    ::-webkit-scrollbar {
      width: 7px;
    }

    ::-webkit-scrollbar-thumb {
      background: #274353;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <div class="terminal">
    <div class="terminal-header">
      <span class="circle red"></span>
      <span class="circle yellow"></span>
      <span class="circle green"></span>
      <span class="terminal-title">fast-terminal</span>
    </div>

    <div class="terminal-body" id="terminal"></div>
  </div>

  <script>
    const terminal = document.getElementById("terminal");

    const commands = [
      {
        command: "npm run start",
        output: [
          "Starting development server...",
          "Loading modules...",
          "Connecting to database...",
          "Database connected successfully.",
          "Server running on http://localhost:3000"
        ]
      },
      {
        command: "git status",
        output: [
          "On branch main",
          "Your branch is up to date with 'origin/main'.",
          "working tree clean"
        ]
      },
      {
        command: "deploy --production",
        output: [
          "Preparing production build...",
          "Optimizing assets...",
          "Uploading files...",
          "Deployment completed successfully!"
        ]
      }
    ];

    const sleep = (ms) =>
      new Promise(resolve => setTimeout(resolve, ms));

    function addLine(html, className = "") {
      const line = document.createElement("div");
      line.className = `line ${className}`;
      line.innerHTML = html;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
      return line;
    }

    async function typeText(element, text, speed = 8) {
      for (const char of text) {
        element.textContent += char;
        terminal.scrollTop = terminal.scrollHeight;
        await sleep(speed);
      }
    }

    async function runTerminal() {
      terminal.innerHTML = "";

      addLine(
        '<span class="output">Welcome to Fast Terminal v1.0.0</span>'
      );

      await sleep(300);

      for (const item of commands) {
        const line = addLine(
          '<span class="prompt">user@server:~$ </span><span class="command"></span><span class="cursor"></span>'
        );

        const commandElement = line.querySelector(".command");
        const cursor = line.querySelector(".cursor");

        // عدد کمتر یعنی تایپ سریع‌تر
        await typeText(commandElement, item.command, 6);

        cursor.remove();
        await sleep(120);

        for (const message of item.output) {
          addLine(`<span class="output">${message}</span>`);
          await sleep(70);
        }

        await sleep(250);
      }

      const finalLine = addLine(
        '<span class="prompt">user@server:~$ </span><span class="cursor"></span>'
      );

      await sleep(1800);
      runTerminal();
    }

    runTerminal();
  </script>
</body>
</html>
