html{scroll-behavior:smooth}
body{min-height:100vh;background:#070707;color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.045;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}

<script>
/* =========================================================
   BACKGROUND ENGINE
   - MATRIX: بارش کاراکترهای متحرک
   - CODE: تایپ سریع کد سفارشی
   ========================================================= */
(() => {
  // ---------- MATRIX ----------
  const canvas = document.getElementById('matrixCanvas');
  const ctx = canvas.getContext('2d');
  let drops = [], fontSize = 18, columns = 0;
  const matrixChars = '01アhmnオカキHMNクHMN<>/{}[]$#@';

  function resizeMatrix() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fontSize = innerWidth < 600 ? 13 : 16;
    columns = Math.ceil(innerWidth / fontSize);
    drops = Array.from({ length: columns }, () => Math.random() * -40);
  }

  function matrixFrame() {
    if (document.body.classList.contains('bg-matrix')) {
      ctx.fillStyle = 'rgba(0,5,2,.075)';
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      ctx.font = fontSize + 'px monospace';
      drops.forEach((y, i) => {
        ctx.fillStyle = Math.random() > .965 ? 'rgba(255,255,255,.9)' : 'rgba(255,106,0,.62)';
        ctx.fillText(matrixChars[(Math.random() * matrixChars.length) | 0], i * fontSize, y * fontSize);
        if (y * fontSize > innerHeight && Math.random() > .975) drops[i] = Math.random() * -22;
        drops[i] += .55;
      });
    }
    requestAnimationFrame(matrixFrame);
  }
  resizeMatrix();
  addEventListener('resize', resizeMatrix, { passive: true });
  matrixFrame();

  // ---------- CUSTOM CODE TYPING + SYNTAX HIGHLIGHT ----------
  // فقط متن داخل #customCode را تغییر دهید. این متن با افکت تایپ نمایش داده می‌شود.
  const customCodeElement = document.getElementById('customCode');
  const codeScreen = document.getElementById('codeScreen');
  const codeProgress = document.getElementById('codeProgress');
  const customCode = customCodeElement.textContent.replace(/^\n+|\n+$/g, '');
  const codeLines = customCode.split('\n');
  let line = 0, position = 0;

  function escapeHTML(value) {
    return value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function highlightCode(value) {
    let x = escapeHTML(value);
    const stash = [];
    x = x.replace(/(\/\/.*)$/g, m => { stash.push('<span class="tok-comment">'+m+'</span>'); return `@@C${stash.length-1}@@`; });
    x = x.replace(/(&quot;.*?&quot;|".*?"|'.*?')/g, m => { stash.push('<span class="tok-string">'+m+'</span>'); return `@@C${stash.length-1}@@`; });
    x = x.replace(/\b(const|let|var|function|return|if|else|for|while|new|class|async|await|true|false|null)\b/g,'<span class="tok-keyword">$1</span>');
    x = x.replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="tok-number">$1</span>');
    x = x.replace(/\b([A-Za-z_$][\w$]*)(?=\s*\()/g,'<span class="tok-function">$1</span>');
    x = x.replace(/\b([A-Za-z_$][\w$]*)(?=\s*:)/g,'<span class="tok-property">$1</span>');
    x = x.replace(/([=+\-*\/!<>])/g,'<span class="tok-operator">$1</span>');
    return x.replace(/@@C(\d+)@@/g,(_,i)=>stash[Number(i)]);
  }
  function renderCode() {
    const completed = codeLines.slice(0,line).map(highlightCode).join('\n');
    const current = highlightCode(codeLines[line]?.slice(0,position) || '');
    codeScreen.innerHTML = completed + (line ? '\n' : '') + current;
    codeProgress.textContent = `TYPING ${Math.round(((line + position / Math.max(codeLines[line]?.length || 1,1)) / codeLines.length) * 100)}%`;
    const nums = Array.from({length:Math.max(line+1,1)},(_,i)=>`<span>${i+1}</span>`).join('');
    document.querySelector('.code-gutter').innerHTML = nums;
  }
  function typeCode() {
    if (!document.body.classList.contains('bg-code')) { setTimeout(typeCode,180); return; }
    const currentLine = codeLines[line] ?? '';
    renderCode();
    if (position < currentLine.length) { position++; setTimeout(typeCode,8+Math.random()*18); }
    else if (line < codeLines.length-1) { line++; position=0; setTimeout(typeCode,45+Math.random()*80); }
    else { codeProgress.textContent='READY • LOOP'; setTimeout(()=>{codeScreen.innerHTML='';line=0;position=0;typeCode()},900); }
  }
  typeCode();

  // ---------- RANDOM BACKGROUND ----------
  const buttons = document.querySelectorAll('.bg-btn');
  function setBackground(mode) {
    document.body.classList.remove('bg-matrix', 'bg-code');
    document.body.classList.add('bg-' + mode);
    buttons.forEach(button => button.classList.toggle('active', button.dataset.bg === mode));
  }
  buttons.forEach(button => button.addEventListener('click', () => setBackground(button.dataset.bg)));
  // در هر بار بارگذاری یکی از دو حالت به صورت تصادفی انتخاب می‌شود.
  setBackground(Math.random() < 0.5 ? 'code' : 'code');

  // ---------- CARD OPACITY ----------
  const opacitySlider = document.getElementById('cardOpacity');
  const opacityValue = document.getElementById('cardOpacityValue');
  function setCardOpacity(value) {
    const v = Number(value);
    document.documentElement.style.setProperty('--card-opacity', v / 100);
    opacityValue.textContent = v + '%';
    localStorage.setItem('hmn-card-opacity', String(v));
  }
  const savedOpacity = Number(localStorage.getItem('hmn-card-opacity'));
  const initialOpacity = Number.isFinite(savedOpacity) && savedOpacity >= 25 && savedOpacity <= 90 ? savedOpacity : 62;
  opacitySlider.value = initialOpacity;
  setCardOpacity(initialOpacity);
  opacitySlider.addEventListener('input', event => setCardOpacity(event.target.value));
})();
</script>
