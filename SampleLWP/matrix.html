<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020504;
    }

    #matrix {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      opacity: .78;
    }

    .matrix-glow {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          rgba(0, 255, 90, .065) 0%,
          rgba(0, 255, 90, .025) 34%,
          transparent 75%
        );
    }

    .matrix-scanlines {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: .18;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        rgba(125, 255, 160, .08) 4px,
        transparent 5px
      );
    }

    .matrix-vignette {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      box-shadow:
        inset 0 0 90px rgba(0, 0, 0, .9),
        inset 0 0 220px rgba(0, 0, 0, .65);
    }

    .page-content {
      position: relative;
      z-index: 5;
    }
  </style>
</head>

<body>

  <canvas id="matrix"></canvas>

  <div class="matrix-glow"></div>
  <div class="matrix-scanlines"></div>
  <div class="matrix-vignette"></div>

  <!-- محتوای سایت را در این قسمت قرار بده -->
  <!--
  <div class="page-content">
    محتوای اصلی سایت
  </div>
  -->

  <script>
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    let W;
    let H;
    let dpr;
    let columns;
    let streams = [];

    const fontSize = 15;

    const symbols =
      "アァカサタナハマヤャラワガザダバパ" +
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
      "0123456789";

    function randomNumber(min, max) {
      return Math.random() * (max - min) + min;
    }

    function randomSymbol() {
      return symbols[Math.floor(Math.random() * symbols.length)];
    }

    function makeStream(x) {
      const length = Math.floor(randomNumber(12, 31));

      return {
        x: x,
        y: randomNumber(-H, H),

        // سرعت افزایش‌یافته
        speed: randomNumber(2.6, 7.2),

        length: length,
        opacity: randomNumber(.16, .52),

        // شروع سریع‌تر ستون‌ها
        delay: Math.floor(randomNumber(0, 35)),

        chars: Array.from(
          { length: length },
          () => randomSymbol()
        )
      };
    }

    function resizeCanvas() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      W = window.innerWidth;
      H = window.innerHeight;

      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      columns = Math.ceil(W / fontSize);
      streams = [];

      for (let i = 0; i < columns; i++) {
        // تعداد بیشتر ستون‌های فعال
        if (Math.random() > .08) {
          streams.push(makeStream(i * fontSize));
        }
      }
    }

    function draw() {
      // محو شدن تدریجی رد حروف
      ctx.fillStyle = "rgba(2, 5, 4, .105)";
      ctx.fillRect(0, 0, W, H);

      ctx.font = `${fontSize}px "Courier New", monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "top";

      streams.forEach((stream) => {
        if (stream.delay > 0) {
          stream.delay--;
          return;
        }

        stream.y += stream.speed;

        for (let i = 0; i < stream.length; i++) {
          const y = stream.y - i * fontSize;

          if (y < -fontSize || y > H + fontSize) {
            continue;
          }

          const fade = 1 - i / stream.length;

          if (i === 0) {
            // سر روشن‌تر ستون
            ctx.fillStyle =
              `rgba(125, 255, 160, ${stream.opacity * .9})`;

            ctx.shadowColor = "rgba(0, 255, 90, .35)";
            ctx.shadowBlur = 5;
          } else {
            // بدنهٔ محوتر ستون
            ctx.fillStyle =
              `rgba(0, 190, 65, ${stream.opacity * fade * .62})`;

            ctx.shadowColor = "rgba(0, 255, 80, .22)";
            ctx.shadowBlur = 2;
          }

          ctx.fillText(
            stream.chars[i],
            stream.x + fontSize / 2,
            y
          );

          // تغییر تصادفی حروف
          if (Math.random() < .018) {
            stream.chars[i] = randomSymbol();
          }
        }

        ctx.shadowBlur = 0;

        // شروع دوبارهٔ ستون پس از خروج از صفحه
        if (stream.y - stream.length * fontSize > H) {
          Object.assign(stream, makeStream(stream.x));
        }
      });

      requestAnimationFrame(draw);
    }

    window.addEventListener("resize", resizeCanvas);

    resizeCanvas();

    ctx.fillStyle = "#020504";
    ctx.fillRect(0, 0, W, H);

    draw();
  </script>

</body>
</html>
