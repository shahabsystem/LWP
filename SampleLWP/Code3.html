<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full Screen Terminal</title>

  <style>
    :root {
      --green: #00ff66;
      --light-green: #8affb3;
      --yellow: #ffe600;
      --red: #ff3b3b;
      --blue: #29a9ff;
      --cyan: #00eaff;
      --white: #eafff0;
      --dark: #020604;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--dark);
    }

    body {
      color: var(--green);
      font-family: Consolas, "Courier New", monospace;
      font-size: clamp(13px, 1.4vw, 18px);
    }

    #terminal {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding: 28px 34px;
      overflow-y: auto;
      background:
        radial-gradient(
          ellipse at center,
          rgba(0, 90, 35, 0.2) 0%,
          rgba(0, 0, 0, 0.95) 80%
        ),
        #020604;
      text-shadow: 0 0 5px currentColor;
    }

    /* خطوط اسکن صفحه */
    #terminal::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.025) 0px,
        rgba(255, 255, 255, 0.025) 1px,
        transparent 1px,
        transparent 4px
      );
      opacity: 0.25;
    }

    /* افکت نور ترمینال */
    #terminal::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 11;
      background: linear-gradient(
        rgba(0, 255, 100, 0.03),
        rgba(0, 0, 0, 0.04)
      );
      animation: screenFlicker 0.15s infinite;
    }

    @keyframes screenFlicker {
      0% {
        opacity: 0.8;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.9;
      }
    }

    .line {
      min-height: 1.7em;
      white-space: pre-wrap;
      word-break: break-word;
      animation: appear 0.12s ease-out;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateX(-5px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .prompt {
      color: var(--green);
    }

    .user {
      color: var(--blue);
    }

    .path {
      color: var(--cyan);
    }

    .command {
      color: var(--white);
    }

    .success {
      color: var(--green);
    }

    .warning {
      color: var(--yellow);
    }

    .danger {
      color: var(--red);
    }

    .info {
      color: var(--blue);
    }

    .cyan {
      color: var(--cyan);
    }

    .muted {
      color: #659274;
    }

    .ascii {
      color: var(--green);
      line-height: 1.15;
      margin-bottom: 18px;
    }

    .cursor {
      display: inline-block;
      width: 0.65em;
      height: 1.1em;
      margin-left: 5px;
      vertical-align: -0.15em;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: blink 0.65s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #020604;
    }

    ::-webkit-scrollbar-thumb {
      background: #075c2d;
      border-radius: 10px;
    }

    ::selection {
      color: #001b0a;
      background: var(--green);
    }
  </style>
</head>

<body>
  <main id="terminal"></main>

  <script>
    const terminal = document.getElementById("terminal");

    const sleep = (ms) =>
      new Promise((resolve) => setTimeout(resolve, ms));

    const logs = [
      ["info", "[INFO] Initializing secure terminal session..."],
      ["success", "[ OK ] Kernel modules loaded"],
      ["success", "[ OK ] Network interface detected"],
      ["info", "[INFO] Checking system configuration..."],
      ["warning", "[WARN] Firewall rules need synchronization"],
      ["success", "[ OK ] Memory check completed: 64 GB available"],
      ["success", "[ OK ] Storage check completed: 82% free"],
      ["info", "[INFO] Connecting to remote server..."],
      ["cyan", "[NET ] Server response: 200 OK"],
      ["success", "[ OK ] Authentication successful"],
      ["warning", "[WARN] New update available"],
      ["info", "[INFO] Downloading system packages..."],
      ["success", "[ OK ] Package 01 installed"],
      ["success", "[ OK ] Package 02 installed"],
      ["success", "[ OK ] Package 03 installed"],
      ["danger", "[FAIL] Test connection interrupted"],
      ["warning", "[WARN] Reconnecting automatically..."],
      ["success", "[ OK ] Connection restored"],
      ["info", "[INFO] Starting deployment process..."],
      ["success", "[ OK ] Files compressed"],
      ["cyan", "[NET ] Uploading files to production server"],
      ["success", "[ OK ] Upload complete"],
      ["success", "[ OK ] Deployment finished successfully"]
    ];

    function createLine(content, className = "") {
      const line = document.createElement("div");
      line.className = `line ${className}`;
      line.innerHTML = content;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
      return line;
    }

    async function typeText(element, text, speed = 5) {
      for (const character of text) {
        element.textContent += character;
        terminal.scrollTop = terminal.scrollHeight;
        await sleep(speed);
      }
    }

    function showHeader() {
      createLine(
        `
        <div class="ascii">
  ████████╗███████╗██████╗ ███╗   ███╗██╗███╗   ██╗ █████╗ ██╗
  ╚══██╔══╝██╔════╝██╔══██╗████╗ ████║██║████╗  ██║██╔══██╗██║
     ██║   █████╗  ██████╔╝██╔████╔██║██║██╔██╗ ██║███████║██║
     ██║   ██╔══╝  ██╔══██╗██║╚██╔╝██║██║██║╚██╗██║██╔══██║██║
     ██║   ███████╗██║  ██║██║ ╚═╝ ██║██║██║ ╚████║██║  ██║██║
     ╚═╝   ╚══════╝╚═╝  ╚═╝╚═╝     ╚═╝╚═╝╚═╝  ╚═══╝╚═╝  ╚═╝╚═╝
        </div>
        <span class="muted">Full Screen Terminal v2.0.26</span>
        `
      );

      createLine(
        `<span class="muted">────────────────────────────────────────────────────────────</span>`
      );
    }

    async function runTerminal() {
      terminal.innerHTML = "";

      showHeader();
      await sleep(350);

      const promptLine = createLine(
        `<span class="user">guest@system</span><span class="muted">:</span><span class="path">~</span><span class="prompt">$ </span><span class="command"></span><span class="cursor"></span>`
      );

      const commandElement = promptLine.querySelector(".command");
      const cursor = promptLine.querySelector(".cursor");

      await typeText(commandElement, "sudo systemctl start cyber-core", 7);
      cursor.remove();

      await sleep(250);

      for (const [type, message] of logs) {
        createLine(`<span class="${type}">${message}</span>`);
        await sleep(90);
      }

      await sleep(250);

      createLine(
        `<span class="muted">────────────────────────────────────────────────────────────</span>`
      );

      createLine(
        `<span class="success">SYSTEM READY</span> <span class="muted">| All services are running</span>`
      );

      await sleep(500);

      createLine(
        `<span class="user">guest@system</span><span class="muted">:</span><span class="path">~</span><span class="prompt">$ </span><span class="cursor"></span>`
      );

      await sleep(5000);
      runTerminal();
    }

    runTerminal();
  </script>
</body>
</html>
