plugins { id 'com.android.application' }

android {
    namespace 'com.shahabsystem.livewebwallpaper'
    compileSdk 35
    defaultConfig {
        applicationId 'com.shahabsystem.livewebwallpaper'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }
}

// Fixes Duplicate Kotlin classes when a transitive dependency brings old jdk7/jdk8 stdlib jars.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
}
