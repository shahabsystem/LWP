<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Terminal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #050505;
      color: #ddd;
      font-family: Consolas, Monaco, "Courier New", monospace;
    }

    .terminal {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle, #112011 0%, #050505 75%);
    }

    .header {
      height: 42px;
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      direction: ltr;
      background: #1c1c1c;
      border-bottom: 1px solid #333;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
    }

    .red {
      background: #ff5f56;
    }

    .yellow {
      background: #ffbd2e;
    }

    .green {
      background: #27c93f;
    }

    .title {
      margin-left: 10px;
      color: #999;
      font-size: 13px;
    }

    #terminal {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: clamp(13px, 2vw, 17px);
      line-height: 1.7;
    }

    .line {
      min-height: 1.7em;
    }

    .prompt {
      color: #35e66b;
    }

    .java {
      color: #ffe66d;
    }

    .keyword {
      color: #ff6b6b;
    }

    .string {
      color: #7ee787;
    }

    .comment {
      color: #777;
    }

    .info {
      color: #55bfff;
    }

    .success {
      color: #35e66b;
    }

    .warning {
      color: #ffd43b;
    }

    .cursor {
      display: inline-block;
      width: 9px;
      height: 1.1em;
      margin-left: 4px;
      vertical-align: middle;
      background: #35e66b;
      animation: blink 0.55s infinite;
    }

    @keyframes blink {
      0%, 50% {
        opacity: 1;
      }

      51%, 100% {
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      .header {
        height: 38px;
        min-height: 38px;
        padding: 0 10px;
      }

      .dot {
        width: 11px;
        height: 11px;
      }

      .title {
        font-size: 11px;
      }

      #terminal {
        padding: 14px 10px;
        font-size: 12px;
        line-height: 1.75;
      }
    }
  </style>
</head>

<body>
  <div class="terminal">
    <div class="header">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="title">Java Terminal — user@system</span>
    </div>

    <div id="terminal"></div>
  </div>

  <script>
    const terminal = document.getElementById("terminal");

    const codeLines = [
      { type: "prompt", text: "user@system:~$ " },
      { type: "java", text: "javac Main.java" },
      { type: "success", text: "Compilation completed successfully." },
      { type: "prompt", text: "user@system:~$ " },
      { type: "java", text: "java Main" },
      { type: "comment", text: "// Starting Java application..." },
      { type: "keyword", text: "public class Main {" },
      { type: "java", text: "    public static void main(String[] args) {" },
      { type: "java", text: "        System.out.println(" },
      { type: "string", text: '            "Welcome to Java Terminal"' },
      { type: "java", text: "        );" },
      { type: "java", text: "    }" },
      { type: "keyword", text: "}" },
      { type: "success", text: "[OK] Application started successfully" },
      { type: "info", text: "[INFO] Checking system resources..." },
      { type: "success", text: "[OK] Memory allocated: 256 MB" },
      { type: "success", text: "[OK] Java Runtime Environment loaded" },
      { type: "prompt", text: "user@system:~$ " },
      { type: "java", text: "System.out.println(\"System is online\");" },
      { type: "success", text: "System is online" }
    ];

    let lineIndex = 0;
    let charIndex = 0;

    // سرعت بیشتر تایپ
    const typingSpeed = 8;

    // فاصله بین خطوط
    const lineDelay = 90;

    function scrollToBottom() {
      terminal.scrollTop = terminal.scrollHeight;
    }

    function typeText() {
      if (lineIndex >= codeLines.length) {
        const cursor = document.createElement("span");
        cursor.className = "cursor";
        terminal.lastElementChild.appendChild(cursor);
        return;
      }

      const currentLine = codeLines[lineIndex];

      if (charIndex === 0) {
        const line = document.createElement("div");
        line.className = `line ${currentLine.type}`;
        terminal.appendChild(line);
      }

      const activeLine = terminal.lastElementChild;
      activeLine.textContent += currentLine.text.charAt(charIndex);

      charIndex++;
      scrollToBottom();

      if (charIndex < currentLine.text.length) {
        setTimeout(typeText, typingSpeed);
      } else {
        charIndex = 0;
        lineIndex++;
        setTimeout(typeText, lineDelay);
      }
    }

    function restartTyping() {
      terminal.innerHTML = "";
      lineIndex = 0;
      charIndex = 0;
      typeText();
    }

    typeText();

    // با کلیک روی صفحه، انیمیشن از اول اجرا می‌شود
    document.addEventListener("click", restartTyping);
  </script>
</body>
</html>
