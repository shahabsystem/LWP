<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Coding Terminal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #050505;
      color: #ddd;
      font-family: Consolas, Monaco, "Courier New", monospace;
    }

    .terminal {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle, #112011 0%, #050505 75%);
    }

    .header {
      height: 42px;
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      direction: ltr;
      background: #1c1c1c;
      border-bottom: 1px solid #333;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
    }

    .red {
      background: #ff5f56;
    }

    .yellow {
      background: #ffbd2e;
    }

    .green {
      background: #27c93f;
    }

    .title {
      margin-left: 10px;
      color: #999;
      font-size: 13px;
    }

    #terminal {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: auto;
      padding: 20px;
      direction: ltr;
      text-align: left;
      white-space: pre;
      font-size: clamp(13px, 2vw, 17px);
      line-height: 1.7;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #35e66b #101010;
    }

    #terminal::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    #terminal::-webkit-scrollbar-track {
      background: #101010;
    }

    #terminal::-webkit-scrollbar-thumb {
      background: #35e66b;
      border-radius: 10px;
    }

    .line {
      min-height: 1.7em;
    }

    .prompt {
      color: #35e66b;
    }

    .java {
      color: #ffe66d;
    }

    .keyword {
      color: #ff6b6b;
    }

    .string {
      color: #7ee787;
    }

    .comment {
      color: #777;
    }

    .info {
      color: #55bfff;
    }

    .success {
      color: #35e66b;
    }

    .warning {
      color: #ffd43b;
    }

    .number {
      color: #c792ea;
    }

    .cursor {
      display: inline-block;
      width: 9px;
      height: 1.1em;
      margin-left: 4px;
      vertical-align: middle;
      background: #35e66b;
      animation: blink 0.55s infinite;
    }

    @keyframes blink {
      0%, 50% {
        opacity: 1;
      }

      51%, 100% {
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      .header {
        height: 38px;
        min-height: 38px;
        padding: 0 10px;
      }

      .dot {
        width: 11px;
        height: 11px;
      }

      .title {
        font-size: 11px;
      }

      #terminal {
        padding: 14px 10px;
        font-size: 12px;
        line-height: 1.75;
      }
    }
  </style>
</head>

<body>

  <div class="terminal">
    <div class="header">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="title">Java Development Terminal</span>
    </div>

    <div id="terminal"></div>
  </div>

  <script>
    const terminal = document.getElementById("terminal");

    const javaCode = `
public class Main {

    private static final String APP_NAME = "Secure Java System";
    private static final int MAX_USERS = 1000;

    public static void main(String[] args) {

        System.out.println("Starting application...");
        System.out.println("Loading configuration...");

        Database database = new Database();
        UserService userService = new UserService(database);
        Authentication authentication = new Authentication();

        if (database.connect()) {
            System.out.println("Database connection established");
        }

        for (int i = 1; i <= 10; i++) {
            String username = "user_" + i;
            User user = new User(username, "user" + i + "@example.com");
            userService.save(user);

            System.out.println("User created: " + username);
        }

        AuthenticationResult result =
                authentication.login("admin", "password");

        if (result.isSuccessful()) {
            System.out.println("Login successful");
            System.out.println("Access level: ADMIN");
        } else {
            System.out.println("Login failed");
        }

        List<String> permissions = new ArrayList<>();
        permissions.add("READ");
        permissions.add("WRITE");
        permissions.add("DELETE");
        permissions.add("EXECUTE");

        for (String permission : permissions) {
            System.out.println("Permission loaded: " + permission);
        }

        System.out.println("Checking system resources...");

        Runtime runtime = Runtime.getRuntime();
        long memory = runtime.totalMemory();
        long freeMemory = runtime.freeMemory();

        System.out.println("Total memory: " + memory);
        System.out.println("Free memory: " + freeMemory);

        if (freeMemory > 0) {
            System.out.println("Memory status: OK");
        }

        for (int counter = 0; counter < 25; counter++) {
            System.out.println(
                "Processing data packet " + counter + "..."
            );
        }

        System.out.println("Encrypting application data...");
        System.out.println("Security protocol enabled");
        System.out.println("All services are running");
        System.out.println("Application started successfully");
    }

    static class Database {

        public boolean connect() {
            System.out.println("Connecting to database...");
            return true;
        }
    }

    static class UserService {

        private final Database database;

        public UserService(Database database) {
            this.database = database;
        }

        public void save(User user) {
            System.out.println(
                "Saving user: " + user.getUsername()
            );
        }
    }

    static class Authentication {

        public AuthenticationResult login(
                String username,
                String password
        ) {
            if (username.equals("admin")
                    && password.equals("password")) {
                return new AuthenticationResult(true);
            }

            return new AuthenticationResult(false);
        }
    }

    static class AuthenticationResult {

        private final boolean successful;

        public AuthenticationResult(boolean successful) {
            this.successful = successful;
        }

        public boolean isSuccessful() {
            return successful;
        }
    }

    static class User {

        private final String username;
        private final String email;

        public User(String username, String email) {
            this.username = username;
            this.email = email;
        }

        public String getUsername() {
            return username;
        }

        public String getEmail() {
            return email;
        }
    }
}
`;

    const lines = [
      {
        type: "prompt",
        text: "user@system:~$ "
      },
      {
        type: "java",
        text: "javac Main.java"
      },
      {
        type: "success",
        text: "[OK] Compilation completed successfully"
      },
      {
        type: "prompt",
        text: "user@system:~$ "
      },
      {
        type: "java",
        text: "java Main"
      },
      {
        type: "comment",
        text: "// Java application is starting..."
      },
      ...javaCode
        .trim()
        .split("\n")
        .map(line => ({
          type: getLineType(line),
          text: line
        })),
      {
        type: "success",
        text: "[OK] Process completed"
      },
      {
        type: "prompt",
        text: "user@system:~$ "
      },
      {
        type: "warning",
        text: "Waiting for next command..."
      }
    ];

    function getLineType(line) {
      const text = line.trim();

      if (text.startsWith("//")) {
        return "comment";
      }

      if (
        text.includes("System.out") ||
        text.includes("String") ||
        text.includes("int ") ||
        text.includes("long ") ||
        text.includes("boolean")
      ) {
        return "java";
      }

      if (
        text.includes("public") ||
        text.includes("private") ||
        text.includes("static") ||
        text.includes("class") ||
        text.includes("return") ||
        text.includes("if") ||
        text.includes("for")
      ) {
        return "keyword";
      }

      if (text.includes('"')) {
        return "string";
      }

      return "java";
    }

    let lineIndex = 0;
    let charIndex = 0;

    // سرعت تایپ زیاد
    const typingSpeed = 5;

    // فاصله بین خطوط
    const lineDelay = 80;

    function scrollToBottom() {
      terminal.scrollTop = terminal.scrollHeight;
    }

    function typeText() {
      if (lineIndex >= lines.length) {
        const cursor = document.createElement("span");
        cursor.className = "cursor";
        terminal.lastElementChild.appendChild(cursor);
        return;
      }

      const currentLine = lines[lineIndex];

      if (charIndex === 0) {
        const line = document.createElement("div");
        line.className = `line ${currentLine.type}`;
        terminal.appendChild(line);
      }

      const activeLine = terminal.lastElementChild;
      activeLine.textContent += currentLine.text.charAt(charIndex);

      charIndex++;

      // اسکرول خودکار هنگام تایپ
      scrollToBottom();

      if (charIndex < currentLine.text.length) {
        setTimeout(typeText, typingSpeed);
      } else {
        charIndex = 0;
        lineIndex++;
        setTimeout(typeText, lineDelay);
      }
    }

    function restartTyping() {
      terminal.innerHTML = "";
      lineIndex = 0;
      charIndex = 0;
      typeText();
    }

    typeText();

    // با کلیک روی صفحه، کد دوباره اجرا می‌شود
    document.addEventListener("click", restartTyping);
  </script>

</body>
</html>
