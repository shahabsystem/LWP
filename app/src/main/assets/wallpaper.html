<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
:root{--bg:#050607;--accent:#ff6a00;--dim:0;--font:16px;--paused:0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff}#matrixCanvas,#codeBg{position:fixed;inset:0;width:100%;height:100%;display:none}#matrixCanvas{display:block}.code-window{position:absolute;width:92%;height:72%;left:4%;top:14%;border:1px solid rgba(255,255,255,.10);border-radius:16px;background:rgba(8,10,12,.34);box-shadow:0 35px 120px rgba(0,0,0,.68);overflow:hidden}.title{height:46px;display:flex;align-items:center;gap:8px;padding:0 15px;border-bottom:1px solid rgba(255,255,255,.06);font:10px Arial;color:#666;direction:ltr}.dot{width:8px;height:8px;border-radius:50%;background:#555}.name{margin-left:8px;color:#777}.body{display:grid;grid-template-columns:48px 1fr;height:calc(100% - 74px)}.gutter{padding:24px 10px 0 0;border-right:1px solid rgba(255,255,255,.045);color:#414141;font:12px/1.95 monospace;text-align:right}.gutter span{display:block}.screen{padding:24px 28px;margin:0;font:13px/1.95 monospace;color:#888;direction:ltr;text-align:left;white-space:pre-wrap;overflow:hidden}.status{height:28px;display:flex;align-items:center;gap:20px;padding:0 14px;border-top:1px solid rgba(255,255,255,.06);color:#555;font:9px Arial;direction:ltr}.status span:first-child{color:var(--accent)}.kw{color:#c792ea}.str{color:#9ccc65}.num{color:#f78c6c}.com{color:#56635b}.fn{color:#82aaff}.prop{color:#89ddff}.op{color:#ffcb6b}.plain{color:#888}.dim{position:fixed;inset:0;background:#000;opacity:var(--dim);pointer-events:none}
</style></head><body><canvas id="matrixCanvas"></canvas><div id="codeBg"><div class="code-window"><div class="title"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="name">LiveWebWallpaper / live-code.js</span></div><div class="body"><aside class="gutter" id="gutter"></aside><pre class="screen" id="screen"></pre></div><div class="status"><span>● LIVE</span><span id="progress">TYPING...</span><span>UTF-8</span></div></div></div><div class="dim"></div>
<script>
(function(){'use strict';
var canvas=document.getElementById('matrixCanvas'),ctx=canvas.getContext('2d'),drops=[],paused=false,mode='matrix',matrixSpeed=55,codeSpeed=55,fontIndex=0,accent='#ff6a00',bg='#050607';
var chars='01アHMNクケコサシスセソタチツテト<>/{}[]$#@';
function resize(){var d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0);var fs=fontIndex===3?13:(innerWidth<600?14:17);var cols=Math.ceil(innerWidth/fs);drops=Array.from({length:cols},function(){return Math.random()*-50});}
function matrix(){if(paused||mode!=='matrix')return;ctx.fillStyle='rgba(0,5,2,.10)';ctx.fillRect(0,0,innerWidth,innerHeight);var fs=fontIndex===3?13:(innerWidth<600?14:17);ctx.font=fs+'px monospace';drops.forEach(function(y,i){ctx.fillStyle=Math.random()>.965?'rgba(255,255,255,.95)':accent;ctx.fillText(chars[(Math.random()*chars.length)|0],i*fs,y*fs);if(y*fs>innerHeight&&Math.random()>.975)drops[i]=Math.random()*-25;drops[i]+=0.28+matrixSpeed/150;});}
function loop(){matrix();requestAnimationFrame(loop)}resize();addEventListener('resize',resize,{passive:true});loop();
var codeLines=['// LIVE CODE','const wallpaper = {','  mode: "creative",','  battery: "optimized",','  render() {','    animate();','    updateDisplay();','  },','  status: "online"','};','// building something new...'];var line=0,pos=0;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function hi(s){var x=esc(s),stash=[];x=x.replace(/(\/\/.*)$/g,function(m){stash.push('<span class="com">'+m+'</span>');return '@@C'+(stash.length-1)+'@@'});x=x.replace(/(&quot;.*?&quot;|".*?"|'.*?')/g,function(m){stash.push('<span class="str">'+m+'</span>');return '@@C'+(stash.length-1)+'@@'});x=x.replace(/\b(const|let|var|function|return|if|else|for|while|new|class|true|false|null)\b/g,'<span class="kw">$1</span>');x=x.replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="num">$1</span>');x=x.replace(/\b([A-Za-z_$][\w$]*)(?=\s*\()/g,'<span class="fn">$1</span>');x=x.replace(/\b([A-Za-z_$][\w$]*)(?=\s*:)/g,'<span class="prop">$1</span>');x=x.replace(/([=+\-*\/!<>])/g,'<span class="op">$1</span>');return x.replace(/@@C(\d+)@@/g,function(_,i){return stash[+i]})}
function render(){var done=codeLines.slice(0,line).map(hi).join('\n'),cur=hi((codeLines[line]||'').slice(0,pos));document.getElementById('screen').innerHTML=done+(line?'\n':'')+cur;document.getElementById('gutter').innerHTML=Array.from({length:Math.max(1,line+1)},function(_,i){return '<span>'+(i+1)+'</span>'}).join('');document.getElementById('progress').textContent='TYPING '+Math.round(((line+pos/Math.max((codeLines[line]||'').length,1))/codeLines.length)*100)+'%'}
function type(){if(paused||mode!=='code'){setTimeout(type,100);return}render();var cur=codeLines[line]||'';if(pos<cur.length){pos++;setTimeout(type,Math.max(4,42-codeSpeed*.36));}else if(line<codeLines.length-1){line++;pos=0;setTimeout(type,45);}else{document.getElementById('progress').textContent='READY • LOOP';setTimeout(function(){line=0;pos=0;type()},650)}}type();
window.applySettings=function(o){o=o||{};mode=o.mode===2?'code':o.mode===1?'matrix':'web';matrixSpeed=+o.matrixSpeed||55;codeSpeed=+o.codeSpeed||55;fontIndex=+o.fontIndex||0;accent=o.accent||'#ff6a00';bg=o.bg||'#050607';document.documentElement.style.setProperty('--accent',accent);document.documentElement.style.setProperty('--bg',bg);document.documentElement.style.setProperty('--dim',((+o.dim||0)/100));var f=['monospace','sans-serif','serif','monospace'][fontIndex];document.documentElement.style.setProperty('--font',f);canvas.style.display=mode==='matrix'?'block':'none';document.getElementById('codeBg').style.display=mode==='code'?'block':'none';};
window.setWallpaperActive=function(active){paused=!active};window.applySettings({});
})();</script></body></html>
